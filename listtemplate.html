<div class="opinion-entry" style="left: calc([[Zustimmung]]0%);" data-value="[[Zustimmung]]">
  <div class="opinion-position" style="--v: [[Zustimmung]];"><span class="opinion-position__marker"></span></div>
  <div class="opinion-bubble">
    <div class="opinion-bubble__text">[[Kommentar]]</div>
    <span class="opinion-bubble__tail"></span>
  </div>
  <div class="opinion-avatar-wrap">
    <div class="opinion-avatar">##userpicture##</div>
    <span class="opinion-value" style="--v: [[Zustimmung]];" data-v="[[Zustimmung]]">[[Zustimmung]]</span>
  </div>
  <div class="opinion-name">##user##</div>
  <div class="opinion-menu">##actionsmenu##</div>
</div>
