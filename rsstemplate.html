<div class="opinion-stage contentmeinung">
  <div class="opinion-header">
    <span class="opinion-label opinion-label--left">Stimme gar nicht zu</span>
    <span class="opinion-label opinion-label--right">Stimme voll zu</span>
  </div>
  <div class="opinion-track">
    <div class="opinion-centerline"></div>
    <div class="opinion-entry" style="left: calc(0%);" data-value="">
      <div class="opinion-bubble">
        <div class="opinion-bubble__text">[[Kommentar]]</div>
        <span class="opinion-bubble__tail"></span>
      </div>
      <div class="opinion-avatar-wrap">
        <div class="opinion-avatar">##userpicture##</div>
        <span class="opinion-value" style="--v: [[Zustimmung]];">[[Zustimmung]]</span>
      </div>
      <div class="opinion-name">##user##</div>
    </div>
  </div>
</div>

<p class="opinion-chosen">Dein gewählter Wert: </p>
<hr>
<p class="opinion-actions" style="text-align:right">##disapprove## ##edit## ##delete##</p>

 [[Zustimmung]]
